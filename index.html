<title>원썸 패링 나이트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<style>
/* Layout: phone-portrait game shell. Lobby = resource bar on top, swappable center view, chunky 5-tab bar at the bottom
   (Survivor.io lobby grammar). Battle = pixel arena on top, player bars, one-thumb touch pad at the bottom. */
:root{
  --ink:#1b1438; --ink-2:#251c4f; --panel:#30276a; --panel-2:#40358a; --edge:#0c0822;
  --gold:#ffc93a; --gold-2:#ef8a00; --green:#5ad46a; --green-2:#1f9646;
  --red:#ff5b5b; --red-2:#c4253c; --blue:#4bb6ff; --blue-2:#1d6bd0; --violet:#a46bff;
  --text:#fff8e8; --muted:#b9b0e2;
  --r-common:#9aa3ad; --r-good:#55c95f; --r-rare:#3f8cff; --r-epic:#b45cff; --r-legend:#ffb020;
  --f-display:'Black Han Sans','Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-body:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--edge);color:var(--text);font-family:var(--f-body);overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img.px,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#app{position:relative;height:100%;max-width:460px;margin:0 auto;overflow:hidden;
  background:radial-gradient(120% 60% at 50% 30%,#3a2d86 0%,var(--ink) 60%,#120d2a 100%)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.ol{text-shadow:0 2px 0 var(--edge),2px 0 0 var(--edge),-2px 0 0 var(--edge),0 -2px 0 var(--edge),2px 2px 0 var(--edge),-2px 2px 0 var(--edge),2px -2px 0 var(--edge),-2px -2px 0 var(--edge),0 4px 0 var(--edge)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* chunky buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:3px solid var(--edge);border-radius:14px;
  font-family:var(--f-display);font-size:17px;padding:8px 14px;color:var(--text);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.22),inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 var(--edge);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 3px 0 rgba(255,255,255,.35),0 1px 0 var(--edge)}
.btn.y{background:linear-gradient(#ffe066,var(--gold) 55%,var(--gold-2))}
.btn.g{background:linear-gradient(#8ff09a,var(--green) 55%,var(--green-2))}
.btn.b{background:linear-gradient(#8fd6ff,var(--blue) 55%,var(--blue-2))}
.btn.r{background:linear-gradient(#ff9a9a,var(--red) 55%,var(--red-2))}
.btn.d{background:linear-gradient(#6c64a6,#4d4588);color:#d8d2ff}
.btn[disabled]{filter:grayscale(.9) brightness(.75);pointer-events:none}
.btn img{width:18px;height:18px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:8px;padding-top:10px;padding-bottom:8px}
.avatar{position:relative;flex:none;width:48px;height:48px;border-radius:12px;border:3px solid var(--edge);
  background:linear-gradient(#6f63d9,#3d3394);box-shadow:inset 0 3px 0 rgba(255,255,255,.25),0 3px 0 var(--edge);overflow:visible}
.avatar canvas{position:absolute;inset:4px;width:34px;height:34px}
.avatar .lv{position:absolute;left:-6px;bottom:-8px;min-width:22px;height:22px;padding:0 4px;border-radius:11px;border:2px solid var(--edge);
  background:var(--gold);color:var(--edge);font-family:var(--f-display);font-size:13px;line-height:18px;text-align:center}
.res{flex:1;display:flex;gap:6px;min-width:0}
.pill{flex:1;min-width:0;position:relative;display:flex;align-items:center;height:30px;border-radius:15px;background:rgba(8,5,25,.7);
  border:2px solid rgba(255,255,255,.08);padding:0 26px 0 26px}
.pill img{position:absolute;left:-4px;top:50%;transform:translateY(-50%);width:28px;height:28px}
.pill b{flex:1;text-align:center;font-weight:normal;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plus{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:7px;border:2px solid var(--edge);
  background:linear-gradient(#8ff09a,var(--green-2));font-family:var(--f-display);font-size:16px;line-height:16px;color:#fff}
.xpwrap{display:none}

/* ---------- views ---------- */
#views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.vscroll{overflow-y:auto;overscroll-behavior:contain;padding-bottom:18px;-webkit-overflow-scrolling:touch}
.vtitle{font-family:var(--f-display);font-size:26px;text-align:center;margin:6px 0 10px;letter-spacing:.5px}

/* battle lobby view */
.sidecol{position:absolute;top:4px;display:flex;flex-direction:column;gap:6px;z-index:2}
.sidecol.l{left:max(10px,env(safe-area-inset-left,0px))}
.sidecol.r{right:max(10px,env(safe-area-inset-right,0px))}
.sbtn{display:flex;flex-direction:column;align-items:center;gap:1px;width:48px}
.sbtn .ic{width:38px;height:38px;border-radius:12px;border:3px solid var(--edge);background:linear-gradient(#574bb0,#352a7e);
  display:grid;place-items:center;box-shadow:inset 0 3px 0 rgba(255,255,255,.2),0 3px 0 var(--edge);font-family:var(--f-display);font-size:20px;position:relative}
.sbtn .ic img{width:24px;height:24px}
.sbtn span{font-size:12px}
.sbtn .dot{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid var(--edge)}
.chapter{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding-top:4px}
.ch-ribbon{font-family:var(--f-display);font-size:13px;letter-spacing:1px;color:#fff;background:rgba(10,6,30,.7);box-shadow:inset 0 0 0 2px var(--stc,var(--gold));padding:3px 14px;border-radius:10px;border:2px solid var(--edge)}
.ch-ribbon b{font-weight:400;font-size:20px;color:var(--stc,var(--gold))}
.ch-title{font-family:var(--f-display);font-size:30px;font-weight:normal;margin:2px 0 10px;text-wrap:balance;text-align:center}
.stagecard{position:relative;flex:1;min-height:120px;width:100%;max-width:330px;border-radius:22px;border:4px solid var(--edge);overflow:hidden;
  box-shadow:0 0 0 3px #6b5fd6,0 0 40px rgba(140,110,255,.45),0 6px 0 3px var(--edge)}
.stagecard canvas{position:absolute;inset:0;width:100%;height:100%}
.stagecard .arrow{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:46px;border-radius:12px;border:3px solid var(--edge);
  background:rgba(20,14,50,.75);font-size:18px;color:var(--gold)}
.stagecard .arrow.l{left:8px}.stagecard .arrow.r{right:8px}
.stagecard .arrow[disabled]{opacity:.3;pointer-events:none}
.boss-tag{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-family:var(--f-display);font-size:16px;letter-spacing:2px;padding:2px 14px;
  border-radius:10px;border:3px solid var(--edge);background:linear-gradient(#ff8a8a,var(--red-2));animation:pulse 1s infinite}
.lock-tag{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:13px;padding:3px 12px;border-radius:10px;background:rgba(10,6,30,.8)}
.stageinfo{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:12px}
.st-num{font-family:var(--f-display);font-size:22px}
.st-name{font-size:16px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(8,5,25,.6);border:1px solid rgba(255,255,255,.1)}
.chip img{width:14px;height:14px}
.chip.warn{color:#ffb3b3;border-color:rgba(255,91,91,.5)}
.dots{display:flex;gap:5px;align-items:center;margin-top:10px;padding-bottom:10px}
.dots i{width:18px;height:18px;border-radius:50%;background:#3a3170;border:2px solid var(--edge);font-style:normal;font-family:var(--f-display);font-size:10px;display:grid;place-items:center;color:#b3aad8}
.dots i.done{color:#3a2a00}.dots i.cur{color:#140f2c;transform:scale(1.25)}
.dots i.done{background:var(--gold)}
.dots i.cur{background:#fff;box-shadow:0 0 8px #fff}
.dots i.boss{border-radius:5px}
.startrow{display:flex;justify-content:center;padding-top:12px;padding-bottom:10px}
.start{width:min(270px,100%);height:64px;font-size:26px;border-radius:20px;flex-direction:column;gap:0;line-height:1.05}
.start small{display:flex;align-items:center;gap:3px;font-family:var(--f-body);font-size:13px;color:var(--edge)}
.start small img{width:15px;height:15px}
.start::after{content:"";position:absolute;inset:-8px;border-radius:26px;border:3px solid rgba(255,214,90,.6);animation:ring 1.6s infinite;pointer-events:none}
.ticker{display:flex;align-items:center;gap:8px;height:28px;margin-bottom:8px;border-radius:14px;background:rgba(8,5,25,.55);overflow:hidden;
  margin-left:max(16px,env(safe-area-inset-left,0px));margin-right:max(16px,env(safe-area-inset-right,0px))}
.tk-label{flex:none;font-size:12px;padding:3px 9px;margin-left:3px;border-radius:11px;background:var(--red-2)}
.tk-track{flex:1;min-width:0;overflow:hidden;white-space:nowrap;font-size:13px;color:var(--muted)}
.tk-track span{display:inline-block;animation:tick 9s linear infinite;padding-left:100%}

/* tab bar */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:74px;background:linear-gradient(#2a215c,#160f36);border-top:3px solid var(--edge);
  box-shadow:0 -3px 0 #4a3fa0 inset;padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar button{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#a89fd8;font-size:13px}
.tabbar button img{width:30px;height:30px;transition:transform .15s}
.tabbar button.on{color:var(--text);background:linear-gradient(#ffd75e,#e98a00);border-left:3px solid var(--edge);border-right:3px solid var(--edge);
  margin-top:-14px;height:calc(100% + 14px);border-radius:16px 16px 0 0;border-top:3px solid var(--edge)}
.tabbar button.on span{font-family:var(--f-display);font-size:15px}
.tabbar button.on img{width:40px;height:40px;transform:translateY(-4px)}
.tabbar .badge{position:absolute;top:6px;right:18%;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid var(--edge)}

/* section blocks for shop/forge/equip/story */
.sec{font-family:var(--f-display);font-size:18px;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:3px;border-radius:2px;background:linear-gradient(90deg,#5a4fc0,transparent)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{border-radius:16px;border:3px solid var(--edge);background:linear-gradient(#41368e,#2c2368);box-shadow:inset 0 3px 0 rgba(255,255,255,.12),0 4px 0 var(--edge)}
.deal{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px}
.deal img{width:44px;height:44px}
.deal .nm{font-size:13px;text-align:center}
.deal .btn{font-size:13px;padding:5px 8px;border-radius:10px;width:100%}
.row{display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:8px}
.row .info{flex:1;min-width:0}
.row .nm{font-size:16px}
.row .ds{font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px}
.row .btn{font-size:14px;padding:6px 10px;min-width:84px;border-radius:11px}
.frame{flex:none;width:58px;height:58px;border-radius:12px;border:3px solid var(--edge);display:grid;place-items:center;position:relative;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.frame img{width:40px;height:40px}
.frame .rk{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);font-size:10px;padding:0 5px;border-radius:6px;background:var(--edge);white-space:nowrap}
.f0{background:linear-gradient(#b8c0c9,#7b838d)}.f1{background:linear-gradient(#7fe08a,#2f9a3e)}.f2{background:linear-gradient(#7fb4ff,#2558c9)}
.f3{background:linear-gradient(#d39bff,#7d2fd0)}.f4{background:linear-gradient(#ffd36b,#e07a00)}
.stats{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.stat{font-size:11px;padding:1px 7px;border-radius:8px;background:rgba(0,0,0,.3);color:#d9d3ff}
.stat.up{color:#8ff09a}
.seg{display:flex;gap:6px;margin:4px 0 10px}
.seg button{flex:1;padding:8px 0;border-radius:12px;border:3px solid var(--edge);background:#2c2368;font-size:15px;color:#a89fd8}
.seg button.on{background:linear-gradient(#8fd6ff,var(--blue-2));color:#fff;font-family:var(--f-display)}
.pkg{padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#7a3fd1,#3b2399 60%,#2a1a72)}
.pkg .imgs{display:flex;flex:none}
.pkg .imgs img{width:34px;height:34px;margin-right:-8px}
.pkg .nm{font-family:var(--f-display);font-size:17px}
.pkg .ds{font-size:12px;color:#e3dbff;margin-top:2px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}

/* equipment view */
.hero-stage{position:relative;height:250px;margin-top:4px;border-radius:20px;background:radial-gradient(60% 60% at 50% 55%,#5b4fd0,#2a2168 70%);border:3px solid var(--edge)}
.hero-stage canvas{position:absolute;left:50%;top:50%;width:130px;height:150px;transform:translate(-50%,-48%)}
.slot{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.slot .frame{width:62px;height:62px}
.slot.s1{left:14px;top:18px}.slot.s2{left:14px;top:138px}.slot.s3{right:14px;top:18px}.slot.s4{right:14px;top:138px}
.potbox{display:flex;gap:4px}.potbox span{display:flex;align-items:center;font-size:13px;color:var(--text)}.potbox img{width:22px;height:22px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.sg{display:flex;justify-content:space-between;padding:8px 10px;border-radius:12px;background:rgba(8,5,25,.5);font-size:13px}
.sg b{font-weight:normal;color:var(--gold);font-variant-numeric:tabular-nums}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.inv button.frame{width:100%;height:auto;aspect-ratio:1;max-width:100%}
.inv .eqd::after{content:"E";position:absolute;top:2px;left:4px;font-family:var(--f-display);font-size:12px;color:var(--gold)}

/* story log */
.log{padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.log .no{flex:none;width:34px;height:34px;border-radius:10px;border:2px solid var(--edge);background:var(--gold);color:var(--edge);font-family:var(--f-display);display:grid;place-items:center}
.log.lock{opacity:.5}.log.lock .no{background:#4a4280;color:#a89fd8}
.log p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.4}
.bigstat{display:flex;gap:8px}
.bigstat .card{flex:1;padding:10px;text-align:center}
.bigstat b{display:block;font-family:var(--f-display);font-size:26px;font-weight:normal;color:var(--gold)}
.bigstat span{font-size:12px;color:var(--muted)}

.evo-path{display:flex;align-items:flex-start;justify-content:center;gap:2px;margin-bottom:10px}
.evo-path>i{font-style:normal;color:#6f63c0;font-size:10px;margin-top:16px}
.ep{display:flex;flex-direction:column;align-items:center;gap:3px;width:64px;font-size:10px;text-align:center;color:var(--muted);opacity:.55}
.ep .frame{width:42px;height:42px}.ep .frame img{width:28px;height:28px}
.ep.done{opacity:.85}.ep.on{opacity:1;color:var(--gold)}.ep.on .frame{box-shadow:0 0 0 3px var(--gold),0 0 16px var(--gold)}
.forge-main{display:flex;gap:14px;align-items:center;padding:14px}
.forge-main .nm{font-family:var(--f-display);font-size:20px}
.forge-main .ds{font-size:12px;color:var(--muted);margin:6px 0 0}
.bigframe{width:96px;height:96px;flex:none}.bigframe img{width:68px;height:68px}
.bigframe.pop{animation:pop .3s ease-out}
.lvline{font-family:var(--f-display);font-size:22px;color:var(--gold)}.lvline span{font-size:14px;color:var(--muted)}
.lvbar{height:10px;border-radius:5px;background:#140d2e;border:2px solid var(--edge);overflow:hidden;margin-top:4px}
.lvbar i{display:block;height:100%;background:linear-gradient(#fff3a0,#ffb300)}
.forge-btn{display:flex;flex-direction:column;align-items:stretch;margin-top:12px}
.btn.big{height:56px;font-size:19px}
.sg .up{color:#8ff09a;font-size:12px}
.slot.e0,.slot.e1,.slot.e2{right:14px}.slot.e0{top:8px}.slot.e1{top:88px}.slot.e2{top:168px}
.slot.e0 .frame,.slot.e1 .frame,.slot.e2 .frame{width:56px;height:56px}
.slot .frame b{font-family:var(--f-display);font-weight:normal;font-size:13px;color:#d9d3ff}
.slot .emptyf b{font-size:26px}
.lockf{filter:grayscale(1) brightness(.7)}
.slot span{max-width:84px;text-align:center}
/* ---------- battle ---------- */
#battle{background:#000;touch-action:none}
.arena{position:relative;flex:1;min-height:0;overflow:hidden}
.arena canvas{position:absolute;inset:0;width:100%;height:100%}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bhud{position:absolute;left:0;right:0;top:0;padding-top:8px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.bh-row{display:flex;align-items:center;gap:8px}
.bh-stage{font-family:var(--f-display);font-size:15px;padding:3px 10px 3px 8px;border-radius:10px;background:rgba(10,6,30,.75);border:2px solid var(--stc,#5a4fc0);display:flex;flex-direction:column;line-height:1.05;min-width:74px}
.bh-stage b{font-weight:400;font-size:17px;color:var(--stc,#fff)}.bh-stage small{font-size:10px;color:#e6dcff;font-family:var(--f-body,inherit);white-space:nowrap}
.st-badge{position:absolute;left:8px;top:8px;z-index:2;font-family:var(--f-display);text-align:center;padding:4px 10px;border-radius:12px;background:rgba(10,6,30,.8);border:3px solid var(--stc,#5a4fc0);line-height:1}
.st-badge small{display:block;font-size:10px;letter-spacing:2px;color:var(--stc,#fff)}.st-badge b{font-weight:400;font-size:28px}
.bh-row .sp{flex:1}
.pausebtn{pointer-events:auto;width:38px;height:38px;border-radius:11px;border:3px solid var(--edge);background:linear-gradient(#6f63d9,#3d3394);display:flex;gap:5px;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--edge)}
.pausebtn i{width:5px;height:15px;border-radius:2px;background:#fff}
.ebar{display:flex;flex-direction:column;gap:3px}
.en-name{font-family:var(--f-display);font-size:15px;display:flex;gap:6px;align-items:center}
.en-name em{font-style:normal;font-size:11px;padding:1px 7px;border-radius:7px;background:var(--red-2)}
.bar{position:relative;height:16px;border-radius:8px;border:2px solid var(--edge);background:#140d2e;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .12s}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000;font-variant-numeric:tabular-nums}
.bar.hp i{background:linear-gradient(#ff8a8a,#e0283f)}
.bar.stun{height:13px}
.arena #cine{position:absolute;inset:0;pointer-events:none;z-index:7}
#cine .lb{position:absolute;left:0;right:0;height:0;background:#000;transition:height .45s ease}
#cine .lb.t{top:0}#cine .lb.b{bottom:0}#cine.on .lb.t{height:9%}#cine.on .lb.b{height:5%}
#cine .ct{position:absolute;left:0;right:0;top:60%;text-align:center;opacity:0;transition:opacity .35s;padding:10px 0;background:linear-gradient(transparent,rgba(10,0,8,.72) 25%,rgba(10,0,8,.72) 75%,transparent)}
#cine .cskip{position:absolute;right:10px;bottom:calc(5% + 6px);font-size:11px;color:#ffd0d6;opacity:0;transition:opacity .3s}#cine.on .cskip{opacity:.85}
#cine .ct.show{opacity:1}
#cine .ct small{display:block;font-family:var(--f-display);font-size:14px;letter-spacing:4px;color:#ffd0d6}

  parryWindowBonus:Math.min(45,Math.round((g.win+lv)*.4))/1000,stunDamage:Math.round(25+(lv-1)*1.2+g.stun),maxShield:Math.round(100+(lv-1)*5+g.shield),

const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function fromMap(rows,pal){const h=rows.length,w=Math.max(...rows.map(r=>r.length));const c=mk(w,h),g=c.getContext('2d');
  rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const k=r[x];if(k!=='.'&&pal[k]){g.fillStyle=pal[k];g.fillRect(x,y,1,1)}}});return c}
function outline(src,col='#1a1226'){const w=src.width+2,h=src.height+2,c=mk(w,h),g=c.getContext('2d');
  const d=src.getContext('2d').getImageData(0,0,src.width,src.height).data;
  const a=(x,y)=>x>=0&&y>=0&&x<src.width&&y<src.height&&d[(y*src.width+x)*4+3]>0;
  g.fillStyle=col;for(let y=-1;y<=src.height;y++)for(let x=-1;x<=src.width;x++){if(!a(x,y)&&(a(x-1,y)||a(x+1,y)||a(x,y-1)||a(x,y+1)))g.fillRect(x+1,y+1,1,1)}
  g.drawImage(src,1,1);return c}
const tintCache=new Map();
function tint(src,col){let m=tintCache.get(src);if(!m){m={};tintCache.set(src,m)}if(m[col])return m[col];
  const c=mk(src.width,src.height),g=c.getContext('2d');g.drawImage(src,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,c.width,c.height);return m[col]=c}

function drawImpact(c,f,t){const q=clamp((t-f.t0)/f.dur,0,1);
  if(f.kind==='slash'){const L=Math.round(f.len*(q<.35?q/.35:1)),w=q<.5?2:1,ca=Math.cos(f.ang),sa=Math.sin(f.ang),from=q>.5?Math.round(-L+(q-.5)*4*L):-L;
    for(let i=from;i<=L;i++)px(c,Math.round(f.x+ca*i),Math.round(f.y+sa*i),w,w,Math.abs(i)>L*.6?'#ffe14d':'#ffffff')}
  else if(f.kind==='pow'){const r=Math.round(3+ease(q)*f.r),r0=Math.round(r*(.3+q*.5));for(let k=0;k<8;k++){const a=k*Math.PI/4+f.ang,col=k%2?'#ffe14d':'#ffffff',rr=k%2?r*.7:r;
      for(let s=r0;s<rr;s++)px(c,Math.round(f.x+Math.cos(a)*s),Math.round(f.y+Math.sin(a)*s),1,1,col)}
    if(q<.3){px(c,Math.round(f.x)-2,Math.round(f.y)-2,5,5,'#ffffff')}}
  else if(f.kind==='burst'){c.globalAlpha=1-q;for(let k=0;k<18;k++){const a=k*Math.PI/9+.17,r1=18+q*50,r2=r1+18+q*30;
      for(let s=r1;s<r2;s+=1)px(c,Math.round(f.x+Math.cos(a)*s),Math.round(f.y+Math.sin(a)*s),1,1,'#ffffff')}c.globalAlpha=1}
}

function drawLane(c,t){

function tutTick(){

  const t=B.time,a=B.atk;

  const n=a.notes[a.idx],toImp=a.impact-t;
  if(B.tutStep===0&&!B.tutShown0&&t-a.start>a.dur*.3){B.tutShown0=true;coachShow(0);return}  // ring is on screen now

  else if(B.tutStep===4&&n.type==='hold'&&t>=n.t-260){a.tutStopped=true;coachShow(4)}
  else if(B.tutStep===5&&n.type==='swipe'&&toImp<=260){a.tutStopped=true;coachShow(5)}
}

/* ===================== wall push (벽꽝) =====================
   every parry shoves the enemy back toward the wall on the right. reaching it = wall slam: explosion + instant groggy.
   getting hit lets the enemy step forward, and it slowly walks back if left alone. */
const pushOn=()=>B.active&&!B.pack&&!(R&&(R.rhythm||R.prologue||R.vault||R.v2));
const pushMax=()=>clamp(wallX()-1-(B.ex0+B.E.scale*7),8,22);
const EX=()=>B.pack?packX(B.packAtk):B.ex0+(B.push||0);
const packX=i=>B.ex0+i*PACK_GAP;
const wallX=()=>B.W-8;
function pushAdd(v){
  if(!pushOn()||B.state==='GROGGY'||B.slam)return;const k=pushMax()/12;
  B.push=clamp(B.push+v*k,0,pushMax());if(v>0){B.pushT=B.time;for(let i=0;i<3;i++)B.parts.push({x:B.ex+B.E.scale*4+rnd(-2,2),y:B.gy-1,vx:rnd(.01,.05),vy:rnd(-.04,-.01),g:.0002,life:rnd(250,420),col:'#c9b48a',sz:1})}
  if(v>0&&B.push>=pushMax())wallSlam();
}
function pushTick(dt,t){
  if(!pushOn()||!B.push||B.state==='GROGGY')return;
  if(B.pushBack){B.push=Math.max(0,B.push-dt*.015);if(!B.push)B.pushBack=false}
  else if((B.state==='IDLE'||B.state==='WINDUP')&&t-B.pushT>1500)B.push=Math.max(0,B.push-dt*.002);
}
function wallSlam(){
  B.push=pushMax();B.slam=true;B.stun=100;B.slams++;cgAdd(12);track('groggy');
  const wx=wallX(),wy=B.gy-B.E.scale*9;
  burstParts(wx-2,wy,34,['#ffffff','#ffd23f','#ff9b2f','#8a8296'],.2,.0004,.5);
  for(let i=0;i<14;i++)B.parts.push({x:wx-1,y:wy+rnd(-12,12),vx:rnd(-.16,-.04),vy:rnd(-.16,-.02),g:.0005,life:rnd(600,1000),col:['#6b6580','#8a8296','#4a4560'][i%3],sz:2,bounce:true});
  B.parts.push({ring:true,x:wx-2,y:wy,r:3,vr:.16,life:520,col:'#ffffff'});B.parts.push({ring:true,x:wx-2,y:wy,r:2,vr:.1,life:420,col:'#ffd23f'});
  addFx('burst',wx-6,wy,{dur:520});addFx('pow',wx-4,wy,{r:22,dur:300});
  sfx('crit',3);sfx('gbreak');sfx('clang',true);flash('#ffffff',.9,420);domShake(4);B.shake=8;zoom(1.18);slow(520,.25);vib([60,40,200]);B.hitstop=Math.max(B.hitstop,140);
  banner('벽꽝!!','벽에 처박혀 기절!');ftAt('벽꽝!',wx-10,wy-14,'combo');B.wallHitT=B.time;
  chip(B.wp.groggyTapDamage*4,'벽꽝');
  if(B.state==='IDLE'){B.slam=false;enterGroggy()}
}
function drawWall(c,t){
  if(!pushOn())return;const wx=wallX(),gy=B.gy,top=Math.max(6,gy-B.E.scale*26-8),r=B.push/pushMax(),hit=B.wallHitT!=null&&t>=B.wallHitT&&t-B.wallHitT<300;
  const ox=hit?Math.round(rnd(-1,1)*2):0,x=wx+ox;
  px(c,x-1,top-1,9,gy-top+2,K);px(c,x,top,7,gy-top,'#5d5872');px(c,x,top,7,1,'#8a8296');px(c,x+5,top,2,gy-top,'#4a4560');

  if(r>.75||B.state==='GROGGY'&&B.slams){px(c,x+3,gy-34,1,7,K);px(c,x+2,gy-28,1,5,K);px(c,x+4,gy-30,1,4,K);px(c,x+1,gy-10,1,5,K)}

}
/* ===================== purple orb rally ===================== */
const orbHand=()=>[B.ex-B.E.scale*5,B.gy-B.E.scale*12];
function orbPos(a,t){
  const k=a.idx,n=a.notes[k],[sx,sy]=shieldPos(),[hx,hy]=orbHand();
  if(k===0){const q=clamp(((t-a.start)/a.dur-.25)/.75,0,1);return q<=0?null:[lerp(hx,sx+2,q),lerp(hy,sy,q)-Math.sin(q*Math.PI)*6]}
  const s0=a.notes[k-1].t,mid=(s0+n.t)/2;
  if(t<mid){const q=clamp((t-s0)/(mid-s0),0,1);return[lerp(sx+2,hx,q),lerp(sy,hy,q)-Math.sin(q*Math.PI)*8]}
  const q=clamp((t-mid)/(n.t-mid),0,1);return[lerp(hx,sx+2,q),lerp(hy,sy,q)-Math.sin(q*Math.PI)*8];
}

   smash: while the club is raised, swipe up to shove (interrupt). too late → it turns red, dodge.

  modal(`<h2>게임 종료</h2><p>게임을 종료할까요?<br>진행 상황은 자동 저장돼요.</p><div class="btns"><button class="btn r" data-m="bye">종료</button><button class="btn d" data-m="x">취소</button></div>`,
  {bye:()=>{closeModal();save();stopMusic();cancelAnimationFrame(titleRAF);$('#title').hidden=true;$('#bye').hidden=false;try{window.close()}catch(e){}}});
};
$('#byeBack').onclick=()=>{ensureAudio();playStory(INTRO,showTitle)};

/* ===================== boot ===================== */
load();initIcons();applyIcons();refreshTop();drawAvatar();
setInterval(()=>{if(!$('#shell').hidden){const e=S.energy;tickEnergy();if(e!==S.energy)refreshTop()}},2000);
playStory(INTRO,()=>{if(!S.prologue)startPrologue();else showTitle()});
if(S.migrated!=null){const r=S.migrated;setTimeout(()=>toast(`무기·갑옷이 방패로 통합! ${fmt(r)}골드 환급`),600);delete S.migrated;save()}
</script>
